name: RD-IMPL-SLICE-B Re-Review-1 Verifier

on:
  pull_request:
    paths:
      - '.github/workflows/rd-impl-slice-b-re-review-1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact implementation head
        uses: actions/checkout@v4
        with:
          ref: 3c1d214ac759ffce61e4d4f8163d2c2b276c4afe
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "3c1d214ac759ffce61e4d4f8163d2c2b276c4afe"
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --package-lock=false
      - name: Typecheck
        run: npm run typecheck
      - name: Build Risk Detector
        run: npm run build:risk-detector
      - name: Run complete Risk Detector tests
        run: npm test -- tests/risk_detector/classifier.test.ts tests/risk_detector/materialize.test.ts tests/risk_detector/evidence.test.ts tests/risk_detector/repository.test.ts
      - name: Remove expected ephemeral outputs
        run: rm -rf node_modules .waep-build
      - name: Verify repository remains clean
        run: test -z "$(git status --porcelain)"
