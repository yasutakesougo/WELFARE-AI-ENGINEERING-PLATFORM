name: DKC Slice A Independent Verifier

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact implementation target
        uses: actions/checkout@v4
        with:
          ref: 606725280790de3444bde258239719e39037024f
          persist-credentials: false

      - name: Verify exact target
        run: test "$(git rev-parse HEAD)" = "606725280790de3444bde258239719e39037024f"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Record toolchain
        run: |
          node --version
          npm --version

      - name: Generate package-local lockfile candidate
        working-directory: packages/development-knowledge-compound-kernel
        run: npm install --package-lock-only --ignore-scripts

      - name: Clean install from generated lockfile
        working-directory: packages/development-knowledge-compound-kernel
        run: npm ci

      - name: Test
        working-directory: packages/development-knowledge-compound-kernel
        run: npm test

      - name: Typecheck
        working-directory: packages/development-knowledge-compound-kernel
        run: npm run typecheck

      - name: Capture npm audit evidence
        working-directory: packages/development-knowledge-compound-kernel
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); console.log(JSON.stringify(a.metadata?.vulnerabilities ?? {}, null, 2))'

      - name: Upload lockfile and audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: dkc-slice-a-lock-and-audit
          path: |
            packages/development-knowledge-compound-kernel/package-lock.json
            packages/development-knowledge-compound-kernel/npm-audit.json
          if-no-files-found: error
