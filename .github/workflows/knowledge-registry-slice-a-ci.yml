name: Knowledge Registry Slice A CI

on:
  pull_request:
    paths:
      - '.github/workflows/knowledge-registry-slice-a-ci.yml'
      - 'src/knowledge_registry/**'
      - 'tests/knowledge_registry/**'
      - 'knowledge/registry/**'
      - 'tsconfig.json'
      - 'package.json'

permissions:
  contents: read

jobs:
  knowledge-registry-slice-a-ci:
    name: knowledge-registry-slice-a-ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact implementation HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Assert exact implementation HEAD
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies without lockfile mutation
        run: npm install --package-lock=false

      - name: Repository typecheck
        run: npm run typecheck

      - name: Focused tests
        run: npm test -- tests/knowledge_registry/registry.test.ts tests/knowledge_registry/population.test.ts

      - name: Remove expected ephemeral outputs
        run: rm -rf node_modules

      - name: Verify repository remains clean
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
